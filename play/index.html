<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZCG Studio Play</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/dialog.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.13.2/pixi.min.js" integrity="sha512-rOMqai9NIPaFWpmvHUjdOa2dSuaaYo6i7E19jS1ZW9rjnrl4qAOOtsOeTk0QgIflFCe2ZYi/7or3CRF6VfBk9g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        #loading-wrapper {
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            position: fixed;
            z-index: 1000000;
            background: '#0d1117';
            /*background: url('../assets/images/main_menu_bg_2.png') center / cover no-repeat;*/
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Опускаем к нижнему краю */
            align-items: center;
            user-select: none;
        }

        /* Контейнер панели загрузки с отступом от самого низа экрана */
        .loading-block {
            width: 100%;
            max-width: 98%; /* Ограничиваем ширину полоски, чтобы она аккуратно смотрелась */
            padding: 0 20px;
            margin-bottom: 2dvh; /* Комфортный отступ от нижней кромки телефона */
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
        }

        .logo-svg {
            width: 300px;
            height: 300px;
            position: fixed;
            top: calc(50% - 150px);
            left: calc(50% - 150px);
        }

        /* Текст загрузки: строгий, читаемый, по центру */
        .loading-text-container {
            width: 100%;
            text-align: center;
            color: #d4af37;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* Обособленный трек полосы с закругленными концами */
        .progress-bar-track {
            width: 100%;
            height: 10px; /* Чуть увеличили высоту, чтобы закругления и цвета хорошо выделялись */
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; /* Закругляем концы трека */
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Заполнение: плоское, с закругленными краями, разделенное строго на два цвета */
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            border-radius: 6px;

            /*background: linear-gradient(90deg, #d4af37 0%, #d4af37 60%, #ffffff 60%, #ffffff 100%);*/
            background: #d4af37;

            transition: width 0.2s ease-out;
        }

        canvas, #app-container, #canvas-wrapper {
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

<div id="loading-wrapper">
    <div class="loading-block">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" class="logo-svg">
            <rect width="500" height="500" fill="#121212" rx="40"/>
            <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Montserrat', sans-serif" font-weight="900">
                <tspan x="50%" dy="0" font-size="125" fill="#ff5a5f" textLength="360" lengthAdjust="spacingAndGlyphs">ZCG</tspan>
                <tspan x="50%" dy="115" font-size="115" fill="#4ecca3" textLength="360" lengthAdjust="spacingAndGlyphs">STUDIO</tspan>
            </text>
        </svg>
        <!-- Текст над полоской -->
        <div class="loading-text-container">
            Loading assets <span id="loading-num">0%</span>
        </div>
        <!-- Выделенная закругленная полоса -->
        <div class="progress-bar-track">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
    </div>
</div>


<div id="editor-layout">
    <div id="main-container">
        <main id="canvas-wrapper">
            <div id="app-container"></div>
        </main>
    </div>
</div>

<script type="module" src="../scripts/game/play.js"></script>
</body>
</html>
